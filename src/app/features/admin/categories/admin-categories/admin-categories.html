<section class="mx-auto mb-8 max-w-[600px] rounded-xl bg-white p-6">
    <h2 class="mt-0 text-xl font-semibold">Categories</h2>

    <form class="mb-6 flex gap-3" [formGroup]="categoryForm" (ngSubmit)="createCategory()">
        <input class="flex-1 rounded-lg border border-gray-300 px-3 py-2.5 text-sm" type="text"
            placeholder="Category name" formControlName="name" />

        <app-button type="submit" variant="primary">
            {{ editingCategoryId() ? 'Update category' : 'Add category' }}
        </app-button>

        @if (editingCategoryId()) {
        <app-button type="button" (click)="cancelEditCategory()">
            Cancel
        </app-button>
        }
    </form>

    <div class="flex flex-col gap-2">
        @for (category of paginatedCategories(); track category.id) {
        <app-category-card [category]="category" (edit)="startEditCategory($event)" (delete)="deleteCategory($event)" />
        }
    </div>

    @if (totalPages() > 1) {
    <div class="mt-6 flex items-center justify-between">
        <app-button type="button" variant="primary" [disabled]="currentPage() === 1" (click)="previousPage()">
            Previous
        </app-button>

        <span class="text-sm text-gray-600">
            Page {{ currentPage() }} of {{ totalPages() }}
        </span>

        <app-button type="button" variant="primary" [disabled]="currentPage() === totalPages()" (click)="nextPage()">
            Next
        </app-button>
    </div>
    }
</section>
