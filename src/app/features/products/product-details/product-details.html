<div class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8 lg:py-14">

    <a routerLink="/products"
        class="mb-10 inline-flex items-center gap-2 text-sm font-medium text-gray-500 transition-colors hover:text-[#3f6fd9]">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
            </path>
        </svg>

        Back to Products
    </a>

    @if (isLoading()) {
    <div class="flex min-h-64 items-center justify-center">
        <p class="text-sm text-gray-500">
            Завантаження деталей...
        </p>
    </div>
    } @else if (errorMessage()) {
    <div class="border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
        {{ errorMessage() }}
    </div>
    } @else if (product(); as product) {

    <div class="grid gap-10 md:grid-cols-2 lg:gap-16">

        <!-- Product image placeholder -->
        <div class="flex aspect-square items-center justify-center overflow-hidden bg-gray-100">
            <div class="px-6 text-center">
                <p class="text-sm font-medium text-gray-400">
                    Картинка товару формується
                </p>
            </div>
        </div>

        <!-- Product information -->
        <div class="flex flex-col pt-6 md:pt-10">

            <h1 class="text-3xl font-medium tracking-tight text-gray-900 sm:text-4xl">
                {{ product.name }}
            </h1>

            <p class="mt-4 text-2xl font-semibold text-[#3f6fd9]">
                {{ product.amount }} {{ getCurrencyCode(product.currency) }}
            </p>

            <div class="mt-8 border-t border-gray-200 pt-6">
                <p class="text-sm text-gray-500">
                    SKU:
                    <span class="font-medium text-gray-700">
                        {{ product.sku }}
                    </span>
                </p>
            </div>

            <div class="mt-8">
                <button type="button" (click)="addToCart(product)"
                    class="bg-[#e7eefc] px-6 py-3 text-sm font-medium text-[#3f6fd9] transition-colors hover:bg-[#d7e3fa] active:scale-[0.98]">
                    Add to cart
                </button>
            </div>

        </div>

    </div>
    }

</div>
