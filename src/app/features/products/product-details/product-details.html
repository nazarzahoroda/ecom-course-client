<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <a routerLink="/products"
        class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-blue-600 mb-8 transition-colors">
        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
            </path>
        </svg>
        Back to Products
    </a>

    @if (isLoading()) {
    <div class="flex justify-center items-center py-20 text-blue-600 font-medium text-lg">
        Завантаження деталей...
    </div>
    } @else if (errorMessage()) {
    <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg max-w-2xl">
        {{ errorMessage() }}
    </div>
    } @else if (product()) {

    <div
        class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col md:flex-row max-w-4xl">

        <div class="bg-gray-50 w-full md:w-1/2 min-h-[300px] flex items-center justify-center p-8">
            <svg class="w-24 h-24 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                </path>
            </svg>
        </div>

        <div class="p-8 w-full md:w-1/2 flex flex-col">
            <!-- Категорія (якщо є) або SKU -->
            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
                SKU: {{ product().sku }}
            </span>

            <h1 class="text-3xl font-bold text-gray-900 mb-4">{{ product().name }}</h1>

            <div class="text-2xl font-bold text-blue-600 mb-8">
                {{ product().amount | currency: product().currency }}
            </div>

            <div class="mt-auto pt-6 border-t border-gray-100">
                <button (click)="addToCart(product())"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition-colors active:scale-[0.98] flex justify-center items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
                        </path>
                    </svg>
                    Add to cart
                </button>
            </div>
        </div>
    </div>
    }
</div>
