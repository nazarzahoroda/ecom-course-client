<div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">

    <header class="mb-8">
        <h1 class="text-4xl font-bold tracking-tight text-gray-900">
            Products
        </h1>
    </header>

    @if (loading()) {
    <div class="flex justify-center items-center py-20 text-blue-600 font-medium text-lg">
        Завантаження...
    </div>
    } @else if (errorMessage()) {
    <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg">
        {{ errorMessage() }}
    </div>
    } @else {

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">

        @for (product of products(); track product.id) {
        <app-product-card
            [product]="product"
            [id]="product.id"
            [name]="product.name"
            [amount]="product.amount"
            [currency]="getCurrencyCode(product.currency)"
            imageUrl="https://placehold.co/400x300/f8fafc/94a3b8?text=Картинка+товару+формується" />
        } @empty {
        <div class="col-span-full py-20 text-center text-gray-500">
            Товарів поки немає.
        </div>
        }

    </div>

    }

</div>
