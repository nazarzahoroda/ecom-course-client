<div class="home-page">
    <section>
        <h2>Categories</h2>

        <div class="categories-grid">
            @for (category of categories(); track category.id) {
            <app-storefront-category-card [name]="category.name" />
            }
        </div>
    </section>
    <section>
        <h2>Products</h2>

        <div class="products-grid">
            @for (product of products(); track product.id) {
            <app-product-card [name]="product.name" [amount]="product.amount" [currency]="getCurrencyCode(product.currency)" />
            }
        </div>
    </section>
</div>
