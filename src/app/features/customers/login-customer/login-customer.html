<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <form class="bg-white max-w-md w-full space-y-6 p-8 rounded-2xl shadow-sm border border-gray-100" [formGroup]="form"
    (ngSubmit)="onSubmit()" novalidate>
    <h1 class="text-3xl font-bold text-center text-gray-900 tracking-tight">Login</h1>

    <div class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input id="email" type="email" formControlName="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="text-sm text-red-500 mt-1 block">A valid email is required.</span>
        }
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input id="password" type="password" formControlName="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="text-sm text-red-500 mt-1 block">Password is required.</span>
        }
      </div>
    </div>

    @if (errorMessage()) {
    <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-sm">
      {{ errorMessage() }}
    </div>
    }

    <div class="flex flex-col gap-3 pt-2">
      <button type="submit" [disabled]="submitting()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        {{ submitting() ? 'Logging in…' : 'Login' }}
      </button>

      <button type="button" routerLink="/register"
        class="w-full text-blue-600 bg-blue-50 hover:bg-blue-100 font-medium py-2.5 px-4 rounded-lg transition-colors">
        Don't have an account? Register
      </button>
    </div>
  </form>
</div>
