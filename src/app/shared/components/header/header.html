<header class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
        <a class="text-2xl font-black tracking-tight" routerLink="/">
            <span class="text-blue-600">Ecom</span><span class="text-gray-900">Course</span>
        </a>

        <div class="flex items-center gap-6">
            @if (authService.isAuthenticated()) {
                <a routerLink="/cart" 
       class="relative flex items-center justify-center p-2 text-gray-600 hover:text-blue-600 transition-colors"
       aria-label="Shopping Cart">
        <!-- SVG Cart Icon -->
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>

        <!-- Опціональний бейдж з кількістю товарів (наприклад, cartService.totalCount()) -->
        <!-- 
        @if (cartService.totalItems() > 0) {
        <span class="absolute -top-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full bg-blue-600 text-[11px] font-bold text-white">
            {{ cartService.totalItems() }}
        </span>
        } 
        -->
    </a>
            @if (isAdmin()) {
            <a routerLink="/admin" class="text-sm font-medium text-gray-600 transition-colors hover:text-blue-600">
                Admin
            </a>
            }
            <a routerLink="/customer" class="text-sm font-medium text-gray-600 transition-colors hover:text-blue-600">
                {{ authService.currentUser()?.email }}
            </a>

            <button type="button" (click)="onLogout()"
                class="bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
                Logout
            </button>
            } @else {
            <a routerLink="/login"
                class="flex items-center gap-2 text-sm font-medium text-gray-600 hover:text-blue-600 transition-colors">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" class="text-gray-400">
                    <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M5 20c0-4 3-7 7-7s7 3 7 7" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                </svg>
                <span>Login</span>
            </a>

            <a routerLink="/register"
                class="bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
                Register
            </a>
            }
        </div>
    </div>
</header>
