<header class="header">
    <div class="header-container">
        <a class="logo" href="/">
            <span class="logo-primary">Ecom</span><span>Course</span>
        </a>

        <div class="search">
            <input type="search" placeholder="Search products" />

            <button type="button" class="search-button" aria-label="Search">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                </svg>
            </button>
        </div>

        <div class="header-actions">
            <a href="/login" class="auth-link">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M5 20c0-4 3-7 7-7s7 3 7 7" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                </svg>

                <span>Login</span>
            </a>
            <a href="/register">Register</a>

            <button type="button" class="cart">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M3 4h2l2 11h10l2-7H6" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="9" cy="19" r="1.5" fill="currentColor" />
                    <circle cx="17" cy="19" r="1.5" fill="currentColor" />
                </svg>

                <span>Cart</span>
                <span class="cart-count">0</span>
            </button>
        </div>
    </div>
</header>
