<div class="grid grid-cols-[1.4fr_0.9fr_0.9fr_1fr_1.8fr_0.8fr] items-center gap-3 border-b border-gray-200 px-3.5 py-3">
  <span class="min-w-0">{{ product().name }}</span>
  <span class="min-w-0">{{ product().amount }}</span>
  <span class="min-w-0">{{ currencyName() }}</span>
  <span class="min-w-0">{{ product().sku }}</span>
  <span class="min-w-0">{{ categoryName() }}</span>

  <div class="flex gap-2">
    <app-button (click)="edit.emit(product())">
      Edit
    </app-button>

    <app-button variant="danger" (click)="delete.emit(product())">
      Delete
    </app-button>
  </div>
</div>
