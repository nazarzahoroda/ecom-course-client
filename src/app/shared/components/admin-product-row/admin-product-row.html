<div class="product-row">
  <span>{{ product().name }}</span>
  <span>{{ product().amount }}</span>
  <span>{{ currencyName() }}</span>
  <span>{{ product().sku }}</span>
  <span>{{ categoryName() }}</span>

  <div class="actions">
    <app-button (click)="edit.emit(product())">
      Edit
    </app-button>
    <app-button variant="danger" (click)="delete.emit(product())">
      Delete
    </app-button>
  </div>
</div>
