<article class="overflow-hidden rounded-lg border border-slate-200 bg-white text-center">
  <div class="aspect-[4/3] overflow-hidden bg-slate-100">
    <img class="block h-full w-full object-cover" [src]="imageUrl()" [alt]="name()" />
  </div>

  <h3 class="m-4 text-base">{{ name() }}</h3>
</article>
